<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#020703"/>
  
  <!-- Subtle gradient overlay -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1f0a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020703" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Border frame -->
  <rect x="20" y="20" width="1160" height="590" rx="20" fill="none" stroke="#00FF41" stroke-width="3" opacity="0.4"/>
  
  <!-- FN Logo (simplified version) -->
  <g transform="translate(100, 150)" filter="url(#glow)">
    <!-- F letter -->
    <path d="M0,0 L60,0 L55,90 L0,90 Z" fill="white"/>
    <path d="M0,0 L110,0 L105,25 L0,25 Z" fill="white"/>
    <path d="M0,55 L80,55 L75,75 L0,75 Z" fill="white"/>
    <!-- N letter -->
    <path d="M140,0 L175,0 L170,90 L135,90 Z" fill="white"/>
    <path d="M260,0 L295,0 L290,90 L255,90 Z" fill="white"/>
    <path d="M140,0 L185,0 L295,90 L250,90 Z" fill="white"/>
    <!-- Horizontal rule -->
    <rect x="0" y="105" width="295" height="3" fill="white" opacity="0.9"/>
    <!-- Shield chevron -->
    <path d="M0,120 L75,160 L150,120 L140,120 L75,155 L10,120 Z" fill="white"/>
  </g>
  
  <!-- Brand name -->
  <text x="450" y="220" font-family="Impact, Arial Black, sans-serif" font-size="72" font-weight="900" fill="white" letter-spacing="4">FRAG NAIJA</text>
  
  <!-- Tagline -->
  <text x="450" y="280" font-family="Arial, sans-serif" font-size="28" fill="#00FF41" letter-spacing="2">NIGERIA'S PREMIER ESPORTS PLATFORM</text>
  
  <!-- Bottom decorative elements -->
  <rect x="100" y="450" width="300" height="4" fill="#00FF41" opacity="0.8"/>
  <rect x="800" y="450" width="300" height="4" fill="#00FF41" opacity="0.8"/>
  
  <!-- Feature icons row -->
  <g transform="translate(100, 500)" fill="#00FF41" opacity="0.9">
    <circle cx="30" cy="30" r="25" fill="none" stroke="#00FF41" stroke-width="2"/>
    <text x="30" y="38" font-family="Arial" font-size="24" text-anchor="middle" fill="#00FF41">🎮</text>
    
    <circle cx="130" cy="30" r="25" fill="none" stroke="#00FF41" stroke-width="2"/>
    <text x="130" y="38" font-family="Arial" font-size="24" text-anchor="middle" fill="#00FF41">🏆</text>
    
    <circle cx="230" cy="30" r="25" fill="none" stroke="#00FF41" stroke-width="2"/>
    <text x="230" y="38" font-family="Arial" font-size="24" text-anchor="middle" fill="#00FF41">⚡</text>
    
    <circle cx="330" cy="30" r="25" fill="none" stroke="#00FF41" stroke-width="2"/>
    <text x="330" y="38" font-family="Arial" font-size="24" text-anchor="middle" fill="#00FF41">👥</text>
  </g>
  
  <!-- URL hint -->
  <text x="600" y="590" font-family="Arial, sans-serif" font-size="20" fill="#888" text-anchor="middle" letter-spacing="1">fragnaija.com.ng</text>
</svg>
